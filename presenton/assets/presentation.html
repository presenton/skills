<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Presenton HTML export</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="m-0 bg-slate-200 p-0 font-sans">
    <main id="presentation-slides-wrapper" class="m-0 w-[1280px] p-0">
      <section
        class="relative h-[720px] w-[1280px] overflow-hidden bg-slate-900 px-20 py-[72px] text-slate-50"
        data-speaker-note="Introduce the subject and intended outcome."
      >
        <p class="m-0 text-[18px] font-bold uppercase tracking-[0.14em] text-teal-300">
          Replace with section label
        </p>
        <h1 class="mt-7 w-[900px] text-[76px] font-bold leading-[0.98] tracking-[-0.04em]">
          Replace with the presentation title
        </h1>
        <p class="mt-6 max-w-[820px] text-[28px] leading-[1.4] text-slate-200">
          Replace this sentence with a concise audience promise or thesis.
        </p>
        <div class="absolute bottom-[72px] right-20 h-3 w-[220px] bg-teal-300"></div>
      </section>

      <section
        class="relative h-[720px] w-[1280px] overflow-hidden bg-[#F5F1E8] px-20 py-14 text-slate-900"
        data-speaker-note="Explain the trend shown in the chart."
      >
        <p class="m-0 text-[18px] font-bold uppercase tracking-[0.14em] text-teal-700">
          Key trend
        </p>
        <div class="mt-5 grid grid-cols-[380px_1fr] gap-14">
          <div>
            <h2 class="text-[52px] font-bold leading-[1.05] tracking-[-0.03em]">
              Replace with a message-led headline
            </h2>
            <p class="mt-6 text-[22px] leading-[1.45] text-slate-600">
              Replace with the implication of the data rather than a generic chart description.
            </p>
          </div>
          <div class="rounded-2xl border border-slate-300 bg-white p-6 shadow-sm">
            <canvas id="chart-a3f91c" width="650" height="430"></canvas>
          </div>
        </div>
      </section>
    </main>

    <script>
      const chartContext = document.querySelector("#chart-a3f91c");
      new Chart(chartContext, {
        type: "bar",
        data: {
          labels: ["Q1", "Q2", "Q3", "Q4"],
          datasets: [
            {
              label: "Replace with metric",
              data: [42, 58, 67, 81],
              backgroundColor: "#0F766E",
              borderRadius: 8,
            },
          ],
        },
        options: {
          responsive: false,
          animation: false,
          plugins: {
            legend: {
              display: true,
              labels: { color: "#334155", font: { size: 16 } },
            },
          },
          scales: {
            x: {
              ticks: { color: "#475569", font: { size: 15 } },
              grid: { display: false },
            },
            y: {
              beginAtZero: true,
              ticks: { color: "#475569", font: { size: 15 } },
              grid: { color: "#E2E8F0" },
            },
          },
        },
      });
    </script>
  </body>
</html>
